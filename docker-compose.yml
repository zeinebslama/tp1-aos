services:
  db:
    image: postgres:16
    container_name: library_db
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: library_api
    environment:
      DATABASE_URL: postgresql+psycopg2://library:library@db:5432/library
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: